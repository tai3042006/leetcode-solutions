name: Update README

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - ideas.json
      - meta.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        run: python scripts/update_readme.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ideas.json meta.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "docs: update README"
          # -X theirs: khi rebase, "theirs" = commit cua bot -> luon uu tien file vua sinh
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
